<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הדמיית ממשק למידה</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* יבוא פונט עברי Assistant מרשת Google Fonts, נטען ממשק דיגיטלי */
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        
        body {
            /* שימוש בפונט Assistant כברירת מחדל לכל הדף, יישור בסיסי */
            font-family: 'Assistant', sans-serif;
            background-color: #e5e7eb; /* רקע אפור להדגשת מסגרת הטלפון */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* מניעת גלילה על ה-body עצמו */
        }

        /* דימוי מסך של טלפון נייד במרכז המסך */
        .mobile-container {
            width: 100%;
            max-width: 390px; /* רוחב מסך קלאסי לסמארטפון */
            height: 844px; /* גובה מסך קלאסי לסמארטפון */
            max-height: 95vh; /* מניעת מתיחה גדולה מדי בגובה */
            background-color: #ffffff;
            position: relative;
            overflow: hidden; /* תוכן גולש רק בתוך main */
            display: flex;
            flex-direction: column;
            border-radius: 40px; /* פינות מעוגלות של המכשיר */
            border: 12px solid #1f2937; /* "ברזל" של מסגרת הטלפון */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* צל כדי שזה יראה מרחף */
            transition: all 0.3s ease-in-out;
        }

        /* מצב מסך מלא פנימי (מסתיר את ההדר אבל שומר על מסגרת המכשיר) */
        .mobile-container.is-fullscreen #mainHeader {
            display: none !important;
        }
        .mobile-container.is-fullscreen #exitFullscreenFloatingBtn {
            display: flex !important;
        }

        /* הגדרת צבע המותג (אדום בורדו) */
        .brand-color {
            color: #8b1525;
        }
        .bg-brand {
            background-color: #8b1525;
        }
        
        /* הסתרת פס הגלילה לכל האלמנטים */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none; /* Internet Explorer 10+ */
            scrollbar-width: none; /* Firefox */
        }

        /* וידוא יישור ימין לטקסט בשדה הצ'אט */
        #chatInput {
            text-align: right;
            direction: rtl;
        }
        /* וידוא יישור ימין ל-placeholder בשדה הצ'אט */
        #chatInput::placeholder {
            text-align: right;
            direction: rtl;
        }
    </style>
</head>
<body>

    <div class="mobile-container" id="mobileContainer">
        
        <!-- Header -->
        <header id="mainHeader" class="flex items-center justify-between p-4 border-b border-gray-200 bg-white z-20 flex-shrink-0 relative">
            <!-- כפתור חזרה (צד שמאל בגלל dir="rtl" ומיקומו הראשון) -->
            <button class="text-gray-700 hover:bg-gray-100 p-2 rounded-full transition-colors z-30">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>

            <!-- כפתור בחירת מצב תצוגה (ליד כפתור החזרה) -->
            <div class="relative z-30 ml-2">
                <button onclick="toggleViewMenu()" class="text-gray-700 hover:bg-gray-100 p-2 rounded-full transition-colors flex items-center justify-center w-10 h-10 bg-gray-50 border border-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </button>
                <!-- תפריט בחירה (מוסתר כברירת מחדל) -->
                <div id="viewMenu" class="absolute top-full left-0 mt-2 bg-white border border-gray-200 rounded-lg shadow-lg hidden flex-col p-1 z-40 min-w-[48px]">
                    <button class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center" title="מצב 1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                    </button>
                    <button class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center" title="מצב 2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    </button>
                    <button class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center" title="מצב 3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <!-- כפתור מסך מלא -->
                    <button onclick="toggleFullScreen()" id="fullScreenBtn" class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center" title="מסך מלא">
                        <svg id="enterFullScreenIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        <svg id="exitFullScreenIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
                    </button>
                </div>
            </div>

            <!-- כותרת ראשית -->
            <h1 class="text-lg font-bold brand-color m-0 flex-grow text-center pl-2 pr-2">ישרים מקבילים...</h1>
            
            <!-- כפתור תפריט נוסף (צד ימין) -->
            <button class="text-gray-700 hover:bg-gray-100 p-2 rounded-full transition-colors z-30">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </header>

        <!-- כפתור חזרה ממסך מלא (צף, מוצג רק במצב מסך מלא פנימי) -->
        <button id="exitFullscreenFloatingBtn" onclick="toggleFullScreen()" class="absolute top-4 right-4 z-50 bg-white/90 backdrop-blur shadow-md text-gray-700 p-2 rounded-full transition-all hidden items-center justify-center border border-gray-200 hover:bg-gray-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        </button>

        <!-- Content Area (Exercise) - גלילה עצמאית -->
        <main id="exerciseArea" class="flex-1 overflow-y-auto no-scrollbar p-6 bg-[#fafafa]">
            <div class="text-center mb-8">
                <!-- כותרת משנה -->
                <h2 class="font-bold text-xl mb-4">תרגיל: מצב הדדי בין ישרים</h2>
            </div>
            
            <!-- טקסט תרגיל -->
            <p class="text-gray-800 text-center leading-relaxed mb-6 max-w-2xl mx-auto" dir="rtl">
                נתונות משוואות הישרים הבאות: y = -x + 5, y = x + 1<br>והגרפים המתאימים באיור.
            </p>

            <!-- Mock Graph Area -->
            <div class="w-full max-w-md mx-auto h-64 bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col items-center justify-center mb-8 px-4 text-center relative">
                <!-- סימן א' מעל הגרף -->
                <div class="absolute -top-5 right-2 w-8 h-8 rounded-full bg-red-100 brand-color flex items-center justify-center font-bold flex-shrink-0 z-10">
                    א.
                </div>
                <!-- גרף ישרים מצטלבים (SVG) -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" class="w-full h-full">
                    <!-- מערכת צירים -->
                    <line x1="20" y1="80" x2="180" y2="80" stroke="#cbd5e1" stroke-width="2"/> <!-- ציר X -->
                    <line x1="100" y1="20" x2="100" y2="140" stroke="#cbd5e1" stroke-width="2"/> <!-- ציר Y -->
                    <!-- שנתות ציר X -->
                    <line x1="60" y1="75" x2="60" y2="85" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="95" font-size="10" text-anchor="middle" fill="#64748b">-4</text>
                    <line x1="140" y1="75" x2="140" y2="85" stroke="#cbd5e1" stroke-width="1"/><text x="140" y="95" font-size="10" text-anchor="middle" fill="#64748b">4</text>
                    <!-- שנתות ציר Y -->
                    <line x1="95" y1="40" x2="105" y2="40" stroke="#cbd5e1" stroke-width="1"/><text x="90" y="45" font-size="10" text-anchor="end" fill="#64748b">4</text>
                    <line x1="95" y1="120" x2="105" y2="120" stroke="#cbd5e1" stroke-width="1"/><text x="90" y="125" font-size="10" text-anchor="end" fill="#64748b">-4</text>
                    <!-- תוויות צירים -->
                    <text x="185" y="85" font-size="12" fill="#64748b">x</text>
                    <text x="105" y="15" font-size="12" fill="#64748b">y</text>

                    <!-- הישר y = -x + 5 (קו אדום יורד) -->
                    <line x1="50" y1="130" x2="150" y2="30" stroke="#ef4444" stroke-width="2"/>
                    
                    <!-- הישר y = x + 1 (קו אדום עולה) -->
                    <line x1="50" y1="30" x2="150" y2="130" stroke="#ef4444" stroke-width="2"/>

                    <!-- נקודת חיתוך P (משוערת ב- (2,3)) -->
                    <circle cx="120" cy="50" r="4" fill="#ef4444"/>
                    <text x="125" y="45" font-size="12" fill="#ef4444" font-weight="bold">P</text>

                    <!-- נקודה A על ציר ה-X (משוערת ב- (5,0)) -->
                    <circle cx="150" cy="80" r="4" fill="#ef4444"/>
                    <text x="155" y="75" font-size="12" fill="#ef4444" font-weight="bold">A</text>
                </svg>
            </div>

            <!-- Questions -->
            <div class="space-y-6 max-w-2xl mx-auto pb-32">
                <div class="flex gap-4 items-start">
                    <!-- שאלה א' -->
                    <p class="text-gray-800 pt-1 font-semibold">איזו משוואה מתאימה לישר העובר בנקודה A ונקודה P?</p>
                </div>
            </div>
        </main>

        <!-- שכבת הצללה עדינה (Overlay) -->
        <div id="chatOverlay" class="absolute inset-0 bg-black/5 transition-opacity duration-300 z-30 opacity-0 pointer-events-none"></div>

        <!-- אזור הכפתורים הצפים והצ'אט המרחף - עכשיו מקובע לצד שמאל -->
        <div class="absolute bottom-8 left-6 z-40">
            
            <!-- כפתור נוסחאות (מוסתר כשהצ'אט פתוח למיקוד טוב יותר) -->
            <div id="formulaBtnContainer" class="transition-opacity duration-300 mb-4 relative z-10 flex-shrink-0">
                <button onclick="toggleFormulaModal()" class="w-10 h-10 bg-white rounded-full shadow-[0_3px_10px_rgb(0,0,0,0.2)] flex items-center justify-center text-[#bd7a7e] border border-gray-100 hover:bg-gray-50 active:scale-95 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                </button>
            </div>

            <!-- מיכל לכפתור הצ'אט והתיבה הנפתחת -->
            <div class="relative flex justify-start">
                <!-- כפתור צ'אט מרחף ראשי (מוצג כשהצ'אט סגור) -->
                <button
                    id="mainChatBtn"
                    onclick="toggleChatInput()"
                    class="w-14 h-14 bg-[#bd7a7e] hover:bg-[#a86a6e] rounded-full shadow-lg flex items-center justify-center text-white transition-all duration-300 ease-in-out relative z-20 scale-100 opacity-100 flex-shrink-0"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                </button>

                <!-- תיבת הטקסט הנפתחת (מרחפת) -->
                <div
                    id="chatInputBar"
                    class="absolute left-0 bottom-0 h-14 bg-[#f4f5f8] rounded-full flex items-center shadow-lg transition-all duration-500 ease-out overflow-hidden origin-left w-14 opacity-0 pointer-events-none z-30"
                >
                    <!-- מיכל פנימי ברוחב קבוע כדי שהתוכן לא יתכווץ בזמן האנימציה -->
                    <div class="flex items-center justify-between w-full h-full px-2 min-w-full" dir="ltr">
                        
                        <!-- אזור הכפתורים השמאלי -->
                        <div class="flex items-center gap-1.5 shrink-0 pl-2 relative">
                            <!-- כפתור למזעור התיבה -->
                            <button 
                                onclick="toggleChatInput()"
                                class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-200 transition-colors mr-1"
                                title="מזער"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </button>

                            <!-- כפתור שליחה -->
                            <button 
                                onclick="sendMessage()"
                                class="w-10 h-10 rounded-full bg-[#bd7a7e] hover:bg-[#a86a6e] transition-colors flex items-center justify-center text-white shadow-sm mr-1"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transform scale-x-[-1] rotate-45 mr-1"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                            </button>

                            <!-- מיכל כפתור הפלוס והתפריט הנפתח -->
                            <div class="relative">
                                <!-- כפתור פלוס (מדיה) -->
                                <button onclick="toggleActionMenu()" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                </button>
                                <!-- תפריט פעולות נפתח (מעל הכפתור) -->
                                <div id="actionMenu" class="absolute bottom-full mb-2 left-0 bg-white border border-gray-200 rounded-lg shadow-lg hidden flex-col p-1 z-40 min-w-[48px]">
                                    <button class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center relative group" title="צילום תמונה">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                                        <!-- Tooltip -->
                                        <span class="absolute bottom-full mb-1 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs rounded py-1 px-2 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none">
                                            צילום תמונה
                                        </span>
                                    </button>
                                    <button class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center relative group" title="מדיה">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                        <!-- Tooltip -->
                                        <span class="absolute bottom-full mb-1 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs rounded py-1 px-2 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none">
                                            מדיה
                                        </span>
                                    </button>
                                    <!-- כפתור פונקציה (f) הועבר לכאן -->
                                    <button class="p-2 hover:bg-gray-100 rounded-md text-gray-700 flex items-center justify-center relative group" title="ביטוי מתמטי">
                                        <span class="font-serif italic text-xl text-[#9c4d4d]">f</span>
                                        <!-- Tooltip -->
                                        <span class="absolute bottom-full mb-1 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs rounded py-1 px-2 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none">
                                            ביטוי מתמטי
                                        </span>
                                    </button>
                                </div>
                            </div>

                        </div>

                        <!-- שדה הקלדה (מיושר לימין) -->
                        <input
                            id="chatInput"
                            type="text"
                            dir="rtl"
                            placeholder="שלח הודעה..."
                            onkeydown="handleKeyPress(event)"
                            class="flex-1 bg-transparent h-full px-4 outline-none text-gray-700 placeholder-gray-400 text-right min-w-[100px]"
                        />
                        
                    </div>
                </div>
            </div>
        </div>

        <!-- Formula Sheet Modal (Overlay) -->
        <div id="formulaModal" class="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="bg-white w-[90%] max-w-md rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="formulaModalContent">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="font-bold text-lg brand-color">דף נוסחאות מתמטיקה</h3>
                    <button onclick="toggleFormulaModal()" class="text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full p-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="space-y-4 text-center py-4">
                    <div class="p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <span class="font-serif italic text-lg">Z = (X - μ) / σ</span>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <span class="font-serif italic text-lg">P(X < x) = Φ(Z)</span>
                    </div>
                </div>
                <button onclick="toggleFormulaModal()" class="w-full mt-4 py-2 bg-brand text-white rounded-lg font-semibold shadow-md hover:bg-[#6b0f1b]">
                    סגור
                </button>
            </div>
        </div>

    </div>

    <script>
        // פונקציה לפתיחת/סגירת תפריט הפעולות (פלוס)
        function toggleActionMenu() {
            const menu = document.getElementById('actionMenu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // פונקציה לפתיחת/סגירת תפריט מצבי התצוגה (למעלה)
        function toggleViewMenu() {
            const menu = document.getElementById('viewMenu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // פונקציה להחלפת מצב מסך מלא (פנימי, שומר על מסגרת המכשיר)
        function toggleFullScreen() {
            const elem = document.getElementById('mobileContainer');
            const enterIcon = document.getElementById('enterFullScreenIcon');
            const exitIcon = document.getElementById('exitFullScreenIcon');

            // החלפת מחלקת ה-CSS שמדמה מסך מלא פנימי
            elem.classList.toggle('is-fullscreen');

            // עדכון אייקונים
            if (elem.classList.contains('is-fullscreen')) {
                enterIcon.classList.add('hidden');
                exitIcon.classList.remove('hidden');
            } else {
                enterIcon.classList.remove('hidden');
                exitIcon.classList.add('hidden');
            }
            
            // סגירת התפריט לאחר הבחירה במידה ונשאר פתוח
            const viewMenu = document.getElementById('viewMenu');
            if (!viewMenu.classList.contains('hidden')) {
                viewMenu.classList.add('hidden');
                viewMenu.classList.remove('flex');
            }
        }

        // סגירת תפריטים בלחיצה מחוצה להם
        document.addEventListener('click', function(event) {
            // סגירת תפריט תצוגה
            const viewMenu = document.getElementById('viewMenu');
            const viewButton = event.target.closest('button[onclick="toggleViewMenu()"]');
            if (!viewButton && !viewMenu.contains(event.target) && !viewMenu.classList.contains('hidden')) {
                toggleViewMenu();
            }

            // סגירת תפריט פעולות
            const actionMenu = document.getElementById('actionMenu');
            const actionButton = event.target.closest('button[onclick="toggleActionMenu()"]');
            if (!actionButton && !actionMenu.contains(event.target) && !actionMenu.classList.contains('hidden')) {
                toggleActionMenu();
            }
        });

        const exerciseArea = document.getElementById('exerciseArea');
        const mainChatBtn = document.getElementById('mainChatBtn');
        const chatInputBar = document.getElementById('chatInputBar');
        const chatOverlay = document.getElementById('chatOverlay');
        const formulaBtnContainer = document.getElementById('formulaBtnContainer');
        const chatInput = document.getElementById('chatInput');
        let isChatOpen = false;

        // פעולת פתיחה/סגירה של התיבה המרחפת
        function toggleChatInput() {
            isChatOpen = !isChatOpen;
            
            if (isChatOpen) {
                // הצג הצללה והסתר כפתור נוסחאות (ללא חסימת גלילה ברקע)
                chatOverlay.classList.remove('opacity-0');
                chatOverlay.classList.add('opacity-100');
                formulaBtnContainer.classList.add('opacity-0', 'pointer-events-none');

                // הסתר כפתור ראשי
                mainChatBtn.classList.remove('scale-100', 'opacity-100');
                mainChatBtn.classList.add('scale-0', 'opacity-0');

                // הרחב את התיבה המרחפת לרוחב מלא
                chatInputBar.classList.remove('w-14', 'opacity-0', 'pointer-events-none');
                // הגדרת רוחב קבוע להתרחבות (רוחב המיכל פחות שוליים) במקום w-full
                chatInputBar.style.width = '342px';
                chatInputBar.classList.add('opacity-100');
                
                // פוקוס על התיבה אחרי השהייה קלה לאנימציה
                setTimeout(() => chatInput.focus(), 300);
            } else {
                // הסתר הצללה והחזר כפתור נוסחאות
                chatOverlay.classList.remove('opacity-100');
                chatOverlay.classList.add('opacity-0');
                formulaBtnContainer.classList.remove('opacity-0', 'pointer-events-none');

                // החזר כפתור ראשי
                mainChatBtn.classList.remove('scale-0', 'opacity-0');
                mainChatBtn.classList.add('scale-100', 'opacity-100');

                // כווץ את התיבה המרחפת חזרה לרוחב הכפתור
                // הסרת הרוחב הקבוע כדי לחזור ל-w-14
                chatInputBar.style.width = ''; 
                chatInputBar.classList.remove('opacity-100');
                chatInputBar.classList.add('w-14', 'opacity-0', 'pointer-events-none');
            }
        }

        // שליחת הודעה
        function sendMessage() {
            const message = chatInput.value;
            if (message.trim() !== '') {
                console.log("הודעה נשלחה:", message);
                chatInput.value = '';
            }
        }

        // האזנה למקשים (Enter לשליחה, Escape לסגירה)
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            } else if (e.key === 'Escape') {
                if(isChatOpen) toggleChatInput();
            }
        }

        // פופאפ נוסחאות
        const formulaModal = document.getElementById('formulaModal');
        const formulaModalContent = document.getElementById('formulaModalContent');
        let isFormulaOpen = false;

        function toggleFormulaModal() {
            isFormulaOpen = !isFormulaOpen;
            
            if (isFormulaOpen) {
                formulaModal.classList.remove('opacity-0', 'pointer-events-none');
                formulaModalContent.classList.remove('scale-95');
                formulaModalContent.classList.add('scale-100');
            } else {
                formulaModal.classList.add('opacity-0', 'pointer-events-none');
                formulaModalContent.classList.remove('scale-100');
                formulaModalContent.classList.add('scale-95');
            }
        }
    </script>
</body>
</html>
